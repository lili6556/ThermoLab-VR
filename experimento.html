<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ThermoLab VR - Experimentos</title>


    <!-- =====================================================
         A-FRAME
    ====================================================== -->

    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>

    <!-- Renderiza texto a partir da fonte real (Baloo 2), garantindo
         que acentos (ã, â, õ, ê, á, í, ó, ç...) apareçam corretamente. -->
    <script src="https://unpkg.com/aframe-troika-text/dist/aframe-troika-text.min.js"></script>


    <!-- =====================================================
         FONTE
    ====================================================== -->

    <link
        href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&display=swap"
        rel="stylesheet"
    >


    <!-- =====================================================
         CSS
    ====================================================== -->

    <style>

        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: #EAF4FF;

            font-family: 'Baloo 2', Arial, sans-serif;

        }

    </style>

</head>


<body>


<a-scene

    background="color: #EAF4FF"

    renderer="
        colorManagement: true;
        antialias: true;
    "

    vr-mode-ui="enabled: true">


    <!-- =====================================================
         FONTES (Baloo 2 - arquivo real, com acentuação completa)
    ====================================================== -->

    <a-assets>

        <img
            id="logo"
            src="./logo.png"
        >

    </a-assets>


    <!-- =====================================================
         FUNDO
    ====================================================== -->

    <a-sky
        color="#EAF4FF">
    </a-sky>


    <!-- =====================================================
         LUZ AMBIENTE
    ====================================================== -->

        type="ambient"

        color="#ffffff"

        intensity="0.95">

    </a-light>


    <a-light

        type="directional"

        color="#ffffff"

        intensity="0.35"

        position="2 6 4">

    </a-light>


    <!-- =====================================================
         PARTÍCULAS
    ====================================================== -->

    <!-- =====================================================

    ====================================================== -->

        <!-- DESCRIÇÃO -->

        <!-- SELO DO NÚMERO -->

            material="shader: flat; transparent: true;">

        </a-circle>

        <a-troika-text

            value="03"

            align="center"

    <!-- =====================================================
         INFORMAÇÃO INFERIOR
    ====================================================== -->

    <!-- =====================================================
         CÂMERA
    ====================================================== -->

    <a-camera

        position="0 1.6 0"

        look-controls>


        <a-cursor

            id="cursor"

            fuse="true"

            fuse-timeout="1200"

            raycaster="
                objects: .experimentoBotao;
                far: 20;
            "

            geometry="
                primitive: ring;
                radiusInner: 0.012;
                radiusOuter: 0.023;
            "

            material="
                shader: flat;
                color: #2D6CFF;
            ">

        </a-cursor>

    </a-camera>


</a-scene>



<!-- =========================================================
     JAVASCRIPT
     (lógica original preservada — apenas as cores usadas nos
     estados dos botões foram ajustadas para a nova paleta)
========================================================= -->

<script>


/* ============================================================
   TEXTURAS (cantos arredondados + sombra suave)
   Adição puramente visual — não interfere na lógica abaixo.
============================================================ */


function roundRectPath(ctx, x, y, w, h, r) {

    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();

}


function makeCanvasTexture(elId, w, h, draw) {

    const canvas = document.createElement("canvas");
    canvas.id = elId;
    canvas.width = w;
    canvas.height = h;
    canvas.style.display = "none";
    document.body.appendChild(canvas);

    const ctx = canvas.getContext("2d");
    draw(ctx, w, h);

    return canvas;

}


makeCanvasTexture("texPanel", 900, 700, (ctx, w, h) => {
    ctx.save();
    ctx.shadowColor = "rgba(20,40,80,0.16)";
    ctx.shadowBlur = 40;
    ctx.shadowOffsetY = 14;
    roundRectPath(ctx, 24, 24, w - 48, h - 48, 46);
    ctx.fillStyle = "#ffffff";
    ctx.fill();
    ctx.restore();
});

makeCanvasTexture("texCard", 620, 570, (ctx, w, h) => {
    ctx.save();
    ctx.shadowColor = "rgba(20,40,80,0.18)";
    ctx.shadowBlur = 26;
    ctx.shadowOffsetY = 10;
    roundRectPath(ctx, 18, 18, w - 36, h - 36, 40);
    ctx.fillStyle = "#ffffff";
    ctx.fill();
    ctx.restore();
});

makeCanvasTexture("texPill", 620, 190, (ctx, w, h) => {
    ctx.save();
    ctx.shadowColor = "rgba(20,40,80,0.22)";
    ctx.shadowBlur = 16;
    ctx.shadowOffsetY = 6;
    roundRectPath(ctx, 14, 14, w - 28, h - 28, (h - 28) / 2);
    ctx.fillStyle = "#ffffff";
    ctx.fill();
    ctx.restore();
});

makeCanvasTexture("texBadge", 260, 260, (ctx, w, h) => {
    ctx.save();
    ctx.shadowColor = "rgba(20,40,80,0.2)";
    ctx.shadowBlur = 14;
    ctx.beginPath();
    ctx.arc(w / 2, h / 2, w / 2 - 16, 0, Math.PI * 2);
    ctx.closePath();
    ctx.fillStyle = "#ffffff";
    ctx.fill();
    ctx.restore();
});


function applyTexture(id, texId) {
    const el = document.getElementById(id);
    if (!el) return;
    el.setAttribute("material", { shader: "flat", src: "#" + texId, transparent: true });
}

applyTexture("painelPrincipal", "texPanel");
applyTexture("logoBackdrop", "texBadge");

document.querySelectorAll("#experimento1 a-plane, #experimento2 a-plane, #experimento3 a-plane")
    .forEach((el) => {
        if (el.classList.contains("experimentoBotao")) {
            el.setAttribute("material", { shader: "flat", src: "#texPill", transparent: true });
        } else {
            el.setAttribute("material", { shader: "flat", src: "#texCard", transparent: true });
        }
    });

document.querySelectorAll("#experimento1 a-circle, #experimento2 a-circle, #experimento3 a-circle")
    .forEach((el) => {
        el.setAttribute("material", { shader: "flat", src: "#texBadge", transparent: true });
    });



/* ============================================================
   PARTÍCULAS 360°
============================================================ */


const ambiente =
    document.getElementById("particulas");


const quantidadeParticulas = 180;


for (
    let i = 0;
    i < quantidadeParticulas;
    i++
) {


    const particula =
        document.createElement("a-sphere");


    /*
     * DISTÂNCIA
     */

    const distancia =
        6 + Math.random() * 10;


    /*
     * DIREÇÃO 360°
     */

    const angulo =
        Math.random() * Math.PI * 2;


    /*
     * ALTURA
     */

    const altura =
        -2 + Math.random() * 7;


    /*
     * POSIÇÃO
     */

    const x =
        Math.cos(angulo) * distancia;


    const z =
        Math.sin(angulo) * distancia;


    /*
     * TAMANHO
     */

    const tamanho =
        0.015 + Math.random() * 0.04;


    /*
     * COR
     */

    const cor =
        Math.random() < 0.5
            ? "#2D6CFF"
            : "#FF6B8A";


    particula.setAttribute(
        "position",
        `${x} ${altura} ${z}`
    );


    particula.setAttribute(
        "radius",
        tamanho
    );


    particula.setAttribute(
        "color",
        cor
    );


    particula.setAttribute(
        "material",
        `
        shader: flat;
        color: ${cor};
        opacity: 0.55;
        transparent: true;
        `
    );


    ambiente.appendChild(
        particula
    );

}



/* ============================================================
   PROGRESSO
============================================================ */


const progresso =
    document.getElementById("progresso");


/*
 * Recupera o progresso salvo.
 */

let mudancasConcluido =
    localStorage.getItem(
        "mudancasConcluido"
    ) === "true";


let reacoesConcluido =
    localStorage.getItem(
        "reacoesConcluido"
    ) === "true";


let maquinaConcluido =
    localStorage.getItem(
        "maquinaConcluido"
    ) === "true";



/* ============================================================
   ATUALIZAR PROGRESSO
============================================================ */


function atualizarProgresso() {


    let total = 0;


    if (mudancasConcluido) {

        total++;

    }


    if (reacoesConcluido) {

        total++;

    }


    if (maquinaConcluido) {

        total++;

    }


    progresso.setAttribute(

        "value",

        "PROGRESSO: " + total + " / 3"

    );

}


atualizarProgresso();



/* ============================================================
   ELEMENTOS
============================================================ */


const btnMudancas =
    document.getElementById(
        "btnMudancas"
    );


const btnReacoes =
    document.getElementById(
        "btnReacoes"
    );


const btnMaquina =
    document.getElementById(
        "btnMaquina"
    );


const textoBotao2 =
    document.getElementById(
        "textoBotao2"
    );


const textoBotao3 =
    document.getElementById(
        "textoBotao3"
    );



/* ============================================================
   LIBERAR EXPERIMENTOS
============================================================ */


/*
 * Se mudanças já foi concluído,
 * libera reações.
 */

if (mudancasConcluido) {


    btnReacoes.setAttribute(

        "color",

        "#2D6CFF"

    );


    textoBotao2.setAttribute(

        "value",

        "Iniciar  →"

    );


    textoBotao2.setAttribute(

        "color",

        "#ffffff"

    );


    btnReacoes.classList.add(
        "botaoLiberado"
    );

}



/*
 * Se reações já foi concluído,
 * libera máquina.
 */

if (reacoesConcluido) {


    btnMaquina.setAttribute(

        "color",

        "#2D6CFF"

    );


    textoBotao3.setAttribute(

        "value",

        "Iniciar  →"

    );


    textoBotao3.setAttribute(

        "color",

        "#ffffff"

    );


    btnMaquina.classList.add(
        "botaoLiberado"
    );

}



/* ============================================================
   SISTEMA DE OLHAR
============================================================ */


let olhando =
    false;


let temporizador =
    null;


/*
 * Qual botão está sendo observado.
 */

function iniciarOlhar(botao, destino, permitido) {


    botao.addEventListener(

        "mouseenter",

        function () {


            if (!permitido()) {

                return;

            }


            olhando = true;


            /*
             * Pequeno atraso para seleção.
             */

            temporizador = setTimeout(

                function () {


                    if (olhando) {

                        window.location.href =
                            destino;

                    }

                },

                1200

            );

        }

    );


    botao.addEventListener(

        "mouseleave",

        function () {


            olhando = false;


            clearTimeout(
                temporizador
            );

        }

    );



    /*
     * Também permite clique.
     */

    botao.addEventListener(

        "click",

        function () {


            if (permitido()) {

                window.location.href =
                    destino;

            }

        }

    );

}



/* ============================================================
   EXPERIMENTO 1
============================================================ */


iniciarOlhar(

    btnMudancas,

    "./mudancas.html",

    function () {

        return true;

    }

);



/* ============================================================
   EXPERIMENTO 2
============================================================ */


iniciarOlhar(

    btnReacoes,

    "./reacoes.html",

    function () {

        return mudancasConcluido;

    }

);



/* ============================================================
   EXPERIMENTO 3
============================================================ */


iniciarOlhar(

    btnMaquina,

    "./maquina.html",

    function () {

        return reacoesConcluido;

    }

);


</script>
