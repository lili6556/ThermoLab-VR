<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>ThermoLab VR - Mudanças de Estado</title>

    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>

    <!-- TEXTO COM SUPORTE COMPLETO A ACENTOS -->
    <script src="https://unpkg.com/aframe-troika-text/dist/aframe-troika-text.min.js"></script>

    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <style>

        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: #EAF4FF;

            font-family: 'Orbitron', sans-serif;

        }

    </style>

</head>


<body>


<a-scene

    background="color: #EAF4FF"

    renderer="
        colorManagement: true;
        antialias: true;
    "

    vr-mode-ui="enabled: true">


    <!-- =====================================================
         ASSETS (logo embutida em base64, funciona sempre)
    ====================================================== -->

    <a-assets>

        <img
            id="logo"
            src="data:image/jpeg;base64,PLACEHOLDER_LOGO_BASE64"
            crossorigin="anonymous">

    </a-assets>


    <!-- =====================================================
         FUNDO
    ====================================================== -->

    <a-sky color="#EAF4FF"></a-sky>


    <!-- =====================================================
         ILUMINAÇÃO
    ====================================================== -->

    <a-light
        type="ambient"
        color="#ffffff"
        intensity="0.75">
    </a-light>


    <a-light
        type="point"
        position="-5 4 -4"
        color="#ffffff"
        intensity="3"
        distance="15">
    </a-light>


    <a-light
        type="point"
        position="5 3 -4"
        color="#ffffff"
        intensity="3"
        distance="15">
    </a-light>


    <!-- =====================================================
         PARTÍCULAS
    ====================================================== -->

    <a-entity id="particulas"></a-entity>


    <!-- =====================================================
         PAINEL PRINCIPAL (fundo da página)
    ====================================================== -->

    <a-plane

        position="0 2.2 -4"

        width="7.8"

        height="6.2"

        color="#EAF4FF"

        material="
            shader: flat;
        ">

    </a-plane>


    <!-- LINHA SUPERIOR -->

    <a-plane

        position="0 5.25 -3.92"

        width="7.8"

        height="0.02"

        color="#008cff"

        material="shader: flat;">

    </a-plane>


    <!-- LINHA INFERIOR -->

    <a-plane

        position="0 -0.85 -3.92"

        width="7.8"

        height="0.02"

        color="#ff1744"

        material="shader: flat;">

    </a-plane>


    <!-- =====================================================
         LOGO
    ====================================================== -->

    <a-circle

        position="-3.25 4.85 -3.88"

        radius="0.32"

        material="
            src: #logo;
            shader: flat;
            transparent: true;
        ">

    </a-circle>


    <a-ring

        position="-3.25 4.85 -3.86"

        radius-inner="0.32"

        radius-outer="0.36"

        color="#008cff"

        material="shader: flat;">

    </a-ring>


    <!-- =====================================================
         TÍTULO
    ====================================================== -->

    <a-troika-text

        value="EXPERIMENTO 01"

        align="center"

        color="#2D6CFF"

        font-size="0.15"

        letter-spacing="0.02"

        position="0 4.88 -3.87">

    </a-troika-text>


    <a-troika-text

        value="MUDANÇAS DE ESTADO"

        color="#14253D"

        font-size="0.34"

        letter-spacing="0.005"

    <a-troika-text

        font-size="0.145"

        max-width="4.6"

        position="0 4.06 -3.87">

    </a-troika-text>


    <!-- =====================================================
         CARTÃO: ÁREA DO TERMÔMETRO
    ====================================================== -->

    <a-plane

        position="-2.35 2.05 -3.88"

        width="1.65"

        height="3.0"

        color="#FFFFFF"

        material="shader: flat;">

    </a-plane>


    <!-- BORDA DO CARTÃO -->

    <a-plane position="-2.35 3.55 -3.87" width="1.65" height="0.025" color="#16223A" material="shader: flat;"></a-plane>
    <a-plane position="-2.35 0.55 -3.87" width="1.65" height="0.025" color="#16223A" material="shader: flat;"></a-plane>
    <a-plane position="-3.175 2.05 -3.87" width="0.025" height="3.0" color="#16223A" material="shader: flat;"></a-plane>
    <a-plane position="-1.525 2.05 -3.87" width="0.025" height="3.0" color="#16223A" material="shader: flat;"></a-plane>


    <!-- TÍTULO TERMÔMETRO -->

    <a-troika-text

        value="TERMÔMETRO"

        align="center"

        color="#2D6CFF"

        font-size="0.135"

        letter-spacing="0.02"

        position="-2.35 3.35 -3.86">

    </a-troika-text>


    <!-- =====================================================
         TERMÔMETRO
    ====================================================== -->

    <!-- Corpo (vidro claro) -->

    <a-cylinder

        position="-2.35 2.2 -3.86"

        radius="0.18"

        height="2.05"

        color="#E4ECF7"

        material="
            shader: flat;
            transparent: true;
            opacity: 0.6;
        ">

    </a-cylinder>


    <!-- Coluna de temperatura -->

    <a-cylinder

        id="colunaTemperatura"

        position="-2.35 2.2 -3.64"

        radius="0.12"

        height="1.75"

        color="#ff1744"

        material="shader: flat;">

    </a-cylinder>


    <!-- Base do termômetro -->

    <a-sphere

        position="-2.35 1.18 -3.86"

        radius="0.27"

        color="#ff1744"

        material="shader: flat;">

    </a-sphere>


    <!-- Temperatura -->

    <a-troika-text

        id="temperatura"

        value="20 °C"

        align="center"

        color="#14253D"

        font-size="0.28"

        letter-spacing="0.005"

        position="-2.35 0.92 -3.86">

    </a-troika-text>


    <!-- Selo (badge) atrás do estado -->

    <a-plane

        position="-2.35 0.55 -3.855"

        width="1.35"

        height="0.34"

        color="#16223A"

        material="shader: flat;">

    </a-plane>


    <!-- Estado -->

    <a-troika-text

        id="estado"

        value="ÁGUA"

        align="center"

        color="#008cff"

        font-size="0.155"

        letter-spacing="0.01"

        position="-2.35 0.55 -3.85">

    </a-troika-text>


    <!-- =====================================================
         CARTÃO: ÁREA DO RECIPIENTE
    ====================================================== -->

    <a-plane

        position="1.25 2.05 -3.88"

        width="4.9"

        height="3.0"

        color="#F3F8FF"

        material="shader: flat;">

    </a-plane>


    <!-- BORDA DO CARTÃO -->

    <a-plane position="1.25 3.55 -3.87" width="4.9" height="0.025" color="#16223A" material="shader: flat;"></a-plane>
    <a-plane position="1.25 0.55 -3.87" width="4.9" height="0.025" color="#16223A" material="shader: flat;"></a-plane>
    <a-plane position="-1.2 2.05 -3.87" width="0.025" height="3.0" color="#16223A" material="shader: flat;"></a-plane>
    <a-plane position="3.7 2.05 -3.87" width="0.025" height="3.0" color="#16223A" material="shader: flat;"></a-plane>


    <!-- =====================================================
         RECIPIENTE
    ====================================================== -->

    <!-- Corpo do recipiente (vidro claro) -->

    <a-box

        position="1.25 2.15 -3.72"

        width="1.8"

        height="1.9"

        depth="0.45"

        color="#FFFFFF"

        material="
            shader: flat;
            transparent: true;
            opacity: 0.22;
        ">

    </a-box>


    <!-- Contorno do recipiente -->

    <a-box position="1.25 3.1 -3.72" width="1.82" height="0.02" depth="0.47" color="#16223A" material="shader: flat;"></a-box>
    <a-box position="1.25 1.2 -3.72" width="1.82" height="0.02" depth="0.47" color="#16223A" material="shader: flat;"></a-box>
    <a-box position="0.36 2.15 -3.72" width="0.02" height="1.9" depth="0.47" color="#16223A" material="shader: flat;"></a-box>
    <a-box position="2.14 2.15 -3.72" width="0.02" height="1.9" depth="0.47" color="#16223A" material="shader: flat;"></a-box>


    <!-- Borda superior (mantida, sinaliza a "boca" do recipiente) -->

    <a-box

        position="1.25 3.1 -3.72"

        width="1.9"

        height="0.07"

        depth="0.5"

        color="#008cff"

        material="shader: flat;">

    </a-box>


    <!-- =====================================================
         ÁGUA
    ====================================================== -->

    <a-box

        id="agua"

        position="1.25 1.55 -3.47"

        width="1.7"

        height="0.7"

        depth="0.35"

        color="#66B2FF"

        material="
            shader: flat;
            transparent: true;
            opacity: 0.7;
        ">

    </a-box>


    <!-- Bolhas -->

    <a-sphere
        id="bolha1"
        position="0.8 1.7 -3.25"
        radius="0.07"
        color="#ffffff"
        visible="false">
    </a-sphere>


    <a-sphere
        id="bolha2"
        position="1.25 1.8 -3.25"
        radius="0.09"
        color="#ffffff"
        visible="false">
    </a-sphere>


    <a-sphere
        id="bolha3"
        position="1.65 1.65 -3.25"
        radius="0.06"
        color="#ffffff"
        visible="false">
    </a-sphere>


    <!-- =====================================================
         FOGO
    ====================================================== -->

    <a-entity id="fogo">


        <!-- chama esquerda -->

        <a-sphere

            id="chama1"

            position="0.75 0.55 -3.65"

            radius="0.14"

            color="#ff1744"

            material="shader: flat;"

            visible="false">

        </a-sphere>


        <!-- chama central -->

        <a-sphere

            id="chama2"

            position="1.25 0.7 -3.65"

            radius="0.19"

            color="#ffb300"

            material="shader: flat;"

            visible="false">

        </a-sphere>


        <!-- chama direita -->

        <a-sphere

            id="chama3"

            position="1.75 0.55 -3.65"

            radius="0.14"

            color="#ff1744"

            material="shader: flat;"

            visible="false">

        </a-sphere>


    </a-entity>


    <!-- Base do forno -->

    <a-box

        position="1.25 0.4 -3.7"

        width="2.2"

        height="0.16"

        depth="0.55"

        color="#DCE6F2"

        material="shader: flat;">

    </a-box>


    <!-- =====================================================
         VAPOR
    ====================================================== -->

    <a-entity id="vapor" visible="false">


        <a-sphere

            position="0.9 3.25 -3.45"

            radius="0.14"

            color="#ffffff"

            material="
                shader: flat;
                transparent: true;
                opacity: 0.7;
            "

            animation="
                property: position;
                from: 0.9 3.2 -3.45;
                to: 0.8 4.0 -3.45;
                dur: 1800;
                loop: true;
            ">

        </a-sphere>


        <a-sphere

            position="1.3 3.25 -3.45"

            radius="0.2"

            color="#ffffff"

            material="
                shader: flat;
                transparent: true;
                opacity: 0.6;
            "

            animation="
                property: position;
                from: 1.3 3.2 -3.45;
                to: 1.4 4.1 -3.45;
                dur: 2200;
                loop: true;
            ">

        </a-sphere>


        <a-sphere

            position="1.7 3.25 -3.45"

            radius="0.14"

            color="#ffffff"

            material="
                shader: flat;
                transparent: true;
                opacity: 0.65;
            "

            animation="
                property: position;
                from: 1.7 3.2 -3.45;
                to: 1.8 3.9 -3.45;
                dur: 1700;
                loop: true;
            ">

        </a-sphere>


    </a-entity>


    <!-- =====================================================
         CARTÃO: CONTROLE DE INTENSIDADE
    ====================================================== -->

    <a-plane

        position="0 -0.15 -3.88"

        width="7.0"

        height="1.15"

        color="#FFFFFF"

        material="shader: flat;">

    </a-plane>


    <!-- BORDA DO CARTÃO -->

    <a-plane position="0 0.425 -3.87" width="7.0" height="0.025" color="#16223A" material="shader: flat;"></a-plane>
    <a-plane position="0 -0.725 -3.87" width="7.0" height="0.025" color="#16223A" material="shader: flat;"></a-plane>
    <a-plane position="-3.5 -0.15 -3.87" width="0.025" height="1.15" color="#16223A" material="shader: flat;"></a-plane>
    <a-plane position="3.5 -0.15 -3.87" width="0.025" height="1.15" color="#16223A" material="shader: flat;"></a-plane>


    <!-- Selo do ícone de fogo -->

    <a-circle position="-2.9 0.25 -3.845" radius="0.13" color="#FFE7DA" material="shader: flat;"></a-circle>

    <a-cone position="-2.9 0.26 -3.84" radius-bottom="0.045" radius-top="0.002" height="0.13" color="#ff6b35" material="shader: flat;"></a-cone>
    <a-sphere position="-2.9 0.205 -3.84" radius="0.035" color="#ffb300" material="shader: flat;"></a-sphere>


    <!-- Título -->

    <a-troika-text

        value="INTENSIDADE DO FOGO"

        align="left"

        color="#14253D"

        font-size="0.16"

        letter-spacing="0.005"

        position="-2.62 0.25 -3.84">

    </a-troika-text>


    <!-- Porcentagem -->

    <a-troika-text

        id="porcentagem"

        value="0%"

        align="right"

        color="#ff1744"

        font-size="0.2"

        position="3.35 0.25 -3.84">

    </a-troika-text>


    <!-- =====================================================
         TRILHO
    ====================================================== -->

    <a-box

        id="trilho"

        class="interativo"

        position="0 -0.25 -3.72"

        width="5.9"

        height="0.06"

        depth="0.06"

        color="#D7E1EF">

    </a-box>


    <!-- Linha vermelha -->

    <a-box

        id="linhaProgresso"

        position="-2.95 -0.25 -3.68"

        width="0.02"

        height="0.07"

        depth="0.07"

        color="#ff1744"

        material="shader: flat;">

    </a-box>


    <!-- =====================================================
         BOTÃO DESLIZANTE
    ====================================================== -->

    <a-entity

        id="slider"

        class="interativo"

        position="-2.95 -0.25 -3.58">


        <!-- Área grande para facilitar o controle -->

        <a-sphere

            radius="0.22"

            color="#ff1744"

            material="shader: flat;">

        </a-sphere>


        <a-ring

            radius-inner="0.22"

            radius-outer="0.27"

            color="#ffffff"

            material="shader: flat;">

        </a-ring>


    </a-entity>


    <!-- =====================================================
         LEGENDA
    ====================================================== -->

    <a-troika-text

        value="SEM FOGO"

        align="center"

        color="#8896AC"

        font-size="0.115"

        letter-spacing="0.01"

        position="-2.95 -0.68 -3.85">

    </a-troika-text>


    <a-troika-text

        value="MÉDIO"

        align="center"

        color="#8896AC"

        font-size="0.115"

        letter-spacing="0.01"

        position="0 -0.68 -3.85">

    </a-troika-text>


    <a-troika-text

        value="MÁXIMO"

        align="center"

        color="#8896AC"

        font-size="0.115"

        letter-spacing="0.01"

        position="2.95 -0.68 -3.85">

    </a-troika-text>


    <!-- =====================================================
         STATUS
    ====================================================== -->

    <a-troika-text

        id="status"

        value="SEM FOGO"

        align="center"

        color="#8896AC"

        font-size="0.16"

        letter-spacing="0.01"

        position="0 0.72 -3.86">

    </a-troika-text>


    <!-- =====================================================
         BOTÃO CONCLUIR
    ====================================================== -->

    <a-entity

        id="areaConclusao"

        visible="false">


        <a-plane

            id="btnConcluir"

            class="interativo"

            position="0 1.05 -3.85"

            width="2.8"

            height="0.55"

            color="#008cff"

            material="shader: flat;">

        </a-plane>


        <a-troika-text

            value="CONCLUIR EXPERIMENTO"

            align="center"

            color="#ffffff"

            font-size="0.15"

            letter-spacing="0.005"

            position="0 1.05 -3.84">

        </a-troika-text>


    </a-entity>


    <!-- =====================================================
         CÂMERA
    ====================================================== -->

    <a-camera

        position="0 1.6 0"

        look-controls>


        <a-cursor

            fuse="false"

            raycaster="
                objects: .interativo;
                far: 30;
            "

            geometry="
                primitive: ring;
                radiusInner: 0.012;
                radiusOuter: 0.028;
            "

            material="
                shader: flat;
                color: #ff1744;
                opacity: 1;
            ">

        </a-cursor>


    </a-camera>


    <!-- =====================================================
         CONTROLE ESQUERDO
    ====================================================== -->

    <a-entity

        id="controleEsquerdo"

        laser-controls="hand: left"

        raycaster="
            objects: .interativo;
            far: 20;
        ">

    </a-entity>


    <!-- =====================================================
         CONTROLE DIREITO
    ====================================================== -->

    <a-entity

        id="controleDireito"

        laser-controls="hand: right"

        raycaster="
            objects: .interativo;
            far: 20;
        ">

    </a-entity>


</a-scene>



<script>

/* ============================================================
   PARTÍCULAS
============================================================ */

const ambiente =
    document.getElementById("particulas");


for (let i = 0; i < 180; i++) {

    const particula =
        document.createElement("a-sphere");


    const distancia =
        6 + Math.random() * 10;


    const angulo =
        Math.random() * Math.PI * 2;


    const altura =
        -2 + Math.random() * 7;


    const x =
        Math.cos(angulo) * distancia;


    const z =
        Math.sin(angulo) * distancia;


    const tamanho =
        0.015 + Math.random() * 0.04;


    const cor =
        Math.random() < 0.5
            ? "#008cff"
            : "#ff1744";


    particula.setAttribute(
        "position",
        `${x} ${altura} ${z}`
    );


    particula.setAttribute(
        "radius",
        tamanho
    );


    particula.setAttribute(
        "material",
        `
        shader: flat;
        color: ${cor};
        emissive: ${cor};
        emissiveIntensity: 4;
        `
    );


    ambiente.appendChild(particula);

}



/* ============================================================
   ELEMENTOS
============================================================ */

const slider =
    document.getElementById("slider");


const trilho =
    document.getElementById("trilho");


const agua =
    document.getElementById("agua");


const temperatura =
    document.getElementById("temperatura");


const porcentagem =
    document.getElementById("porcentagem");


const estado =
    document.getElementById("estado");


const status =
    document.getElementById("status");


const instrucao =
    document.getElementById("instrucao");


const linhaProgresso =
    document.getElementById("linhaProgresso");


const colunaTemperatura =
    document.getElementById("colunaTemperatura");


const vapor =
    document.getElementById("vapor");


const bolha1 =
    document.getElementById("bolha1");


const bolha2 =
    document.getElementById("bolha2");


const bolha3 =
    document.getElementById("bolha3");


const chama1 =
    document.getElementById("chama1");


const chama2 =
    document.getElementById("chama2");


const chama3 =
    document.getElementById("chama3");


const areaConclusao =
    document.getElementById("areaConclusao");


const btnConcluir =
    document.getElementById("btnConcluir");


const controleEsquerdo =
    document.getElementById("controleEsquerdo");


const controleDireito =
    document.getElementById("controleDireito");



/* ============================================================
   VARIÁVEIS
============================================================ */

let intensidade = 0;

let arrastando = false;

let controleAtivo = null;

let concluido = false;


const MIN_X = -2.95;

const MAX_X = 2.95;



/* ============================================================
   ATUALIZAR EXPERIMENTO
============================================================ */

function atualizarExperimento(valor) {

    if (concluido) {
        return;
    }

    intensidade = Math.max(
        0,
        Math.min(
            100,
            valor
        )
    );


    /* ========================================================
       MOVER A BOLINHA
    ======================================================== */

    const x =
        MIN_X +
        (
            (MAX_X - MIN_X) *
            (intensidade / 100)
        );

    slider.setAttribute(
        "position",
        `${x} -0.25 -3.58`
    );


    /* ========================================================
       PORCENTAGEM
    ======================================================== */

    porcentagem.setAttribute(
        "value",
        `${Math.round(intensidade)}%`
    );


    /* ========================================================
       FOGO
    ======================================================== */

    const mostrarFogo =
        intensidade > 0;

    chama1.setAttribute("visible", mostrarFogo);
    chama2.setAttribute("visible", mostrarFogo);
    chama3.setAttribute("visible", mostrarFogo);


    /* ========================================================
       STATUS
    ======================================================== */

    if (intensidade < 50) {

        status.setAttribute(
            "value",
            "SEM FOGO"
        );

        status.setAttribute(
            "color",
            "#8896AC"
        );


        bolha1.setAttribute("visible", false);
        bolha2.setAttribute("visible", false);
        bolha3.setAttribute("visible", false);

    }

    else if (intensidade < 100) {

        status.setAttribute(
            "value",
            "MÉDIO"
        );

        status.setAttribute(
            "color",
            "#ff1744"
        );


        bolha1.setAttribute("visible", true);
        bolha2.setAttribute("visible", true);
        bolha3.setAttribute("visible", true);

    }

    else {

        status.setAttribute(
            "value",
            "MÁXIMO"
        );

        status.setAttribute(
            "color",
            "#ff1744"
        );

    }


    /* ========================================================
       FINALIZAR AO CHEGAR EM 100%
    ======================================================== */

    if (intensidade >= 70) {

        finalizarExperimento();

    }

}



/* ============================================================
   OBTER PONTO DE INTERSEÇÃO DO CONTROLE (RAYCASTER)
============================================================ */

function obterIntersecao(controller) {

    const raycasterComponent =
        controller.components.raycaster;


    if (!raycasterComponent) {
        return null;
    }


    const intersections =
        raycasterComponent.intersections;


    if (!intersections || intersections.length === 0) {
        return null;
    }


    return intersections[0].point;

}



/* ============================================================
   INICIAR ARRASTAMENTO
============================================================ */

function iniciarArrastamento(controller) {

    if (concluido) {
        return;
    }

    const ponto =
        obterIntersecao(controller);

    if (!ponto) {
        return;
    }

    arrastando = true;

    controleAtivo = controller;

    atualizarArrastamento(controller);
}


/* ============================================================
   ARRASTAR
============================================================ */

function atualizarArrastamento(controller) {

    if (!arrastando) {
        return;
    }


    if (controller !== controleAtivo) {
        return;
    }


    const ponto =
        obterIntersecao(controller);


    if (!ponto) {
        return;
    }


    const x =
        Math.max(
            MIN_X,
            Math.min(
                MAX_X,
                ponto.x
            )
        );


    const percentual =
        ((x - MIN_X) /
        (MAX_X - MIN_X)) * 100;


    atualizarExperimento(
        percentual
    );

}



/* ============================================================
   TERMINAR ARRASTAMENTO
============================================================ */

function terminarArrastamento(controller) {

    if (controller !== controleAtivo) {
        return;
    }


    arrastando = false;

    controleAtivo = null;


    if (!concluido) {

        if (intensidade < 50) {

            status.setAttribute(
                "value",
                "SEM FOGO"
            );

        }

        else if (intensidade < 100) {

            status.setAttribute(
                "value",
                "MÉDIO"
            );

        }

        else {

            status.setAttribute(
                "value",
                "MÁXIMO"
            );

        }

    }

}



/* ============================================================
   ATUALIZAÇÃO CONTÍNUA DO ARRASTAMENTO
============================================================ */

function atualizarControleVR() {

    if (
        arrastando &&
        controleAtivo &&
        !concluido
    ) {

        atualizarArrastamento(
            controleAtivo
        );

    }

    requestAnimationFrame(
        atualizarControleVR
    );
}


atualizarControleVR();


controleEsquerdo.addEventListener(
    "triggerup",
    function () {

        terminarArrastamento(
            controleEsquerdo
        );

    }
);


controleDireito.addEventListener(
    "triggerup",
    function () {

        terminarArrastamento(
            controleDireito
        );

    }
);



/* ============================================================
   ATUALIZAÇÃO CONTÍNUA DO LASER
============================================================ */




/* ============================================================
   TESTE PELO OLHAR / CURSOR (CLIQUE NO TRILHO)
============================================================ */

trilho.addEventListener(
    "click",
    function (evento) {

        if (concluido) {
            return;
        }


        if (
            evento.detail &&
            evento.detail.intersection
        ) {

            const ponto =
                evento.detail.intersection.point;


            const x =
                Math.max(
                    MIN_X,
                    Math.min(
                        MAX_X,
                        ponto.x
                    )
                );


            const percentual =
                (
                    (x - MIN_X) /
                    (MAX_X - MIN_X)
                ) * 100;


            atualizarExperimento(
                percentual
            );

        }

    }
);


/*
 * A esfera de arraste fica na frente do trilho (mais perto da
 * câmera). Sem esse handler, um clique nela não teria efeito
 * algum, e perto do final o progresso nunca chegaria aos 100%.
 */

slider.addEventListener(
    "click",
    function (evento) {

        if (concluido) {
            return;
        }


        if (
            evento.detail &&
            evento.detail.intersection
        ) {

            const ponto =
                evento.detail.intersection.point;


            const x =
                Math.max(
                    MIN_X,
                    Math.min(
                        MAX_X,
                        ponto.x
                    )
                );


            const percentual =
                (
                    (x - MIN_X) /
                    (MAX_X - MIN_X)
                ) * 100;


            atualizarExperimento(
                percentual
            );

        }

    }
);



/* ============================================================
   FINALIZAR EXPERIMENTO
============================================================ */

function finalizarExperimento() {

    if (concluido) {
        return;
    }


    concluido = true;


    /* ========================================================
       VALORES FINAIS
    ======================================================== */

    intensidade = 100;


    porcentagem.setAttribute(
        "value",
        "100%"
    );


    temperatura.setAttribute(
        "value",
        "120 °C"
    );


    estado.setAttribute(
        "value",
        "VAPOR"
    );


    /* ========================================================
       CONTROLE NO FINAL
    ======================================================== */

    slider.setAttribute(
        "position",
        `${MAX_X} -0.25 -3.58`
    );


    /* ========================================================
       ÁGUA FERVENDO / VAPOR
    ======================================================== */

    bolha1.setAttribute("visible", true);
    bolha2.setAttribute("visible", true);
    bolha3.setAttribute("visible", true);


    vapor.setAttribute(
        "visible",
        "true"
    );


    /* ========================================================
       FOGO MÁXIMO
    ======================================================== */

    chama1.setAttribute("visible", true);
    chama2.setAttribute("visible", true);
    chama3.setAttribute("visible", true);

    chama1.setAttribute("scale", "1.4 1.4 1.4");
    chama2.setAttribute("scale", "1.4 1.4 1.4");
    chama3.setAttribute("scale", "1.4 1.4 1.4");


    /* ========================================================
       STATUS
    ======================================================== */

    status.setAttribute(
        "value",
        "EXPERIMENTO CONCLUÍDO!"
    );


    status.setAttribute(
        "color",
        "#008cff"
    );


    instrucao.setAttribute(
        "value",
        "Você transformou água em vapor."
    );


    /* ========================================================
       BOTÃO
    ======================================================== */

    areaConclusao.setAttribute(
        "visible",
        "true"
    );


    /* ========================================================
       SALVAR
    ======================================================== */

    localStorage.setItem(
        "mudancasConcluido",
        "true"
    );

}



/* ============================================================
   BOTÃO CONCLUIR
============================================================ */

btnConcluir.addEventListener(
    "click",
    function() {

        window.location.href =
            "./experimento.html";

    }
);

</script>
