<script>


/* ============================================================
   PARTÍCULAS
============================================================ */

const ambiente =
    document.getElementById("particulas");


for (let i = 0; i < 220; i++) {

    const particula =
        document.createElement("a-sphere");


    const distancia =
        6 + Math.random() * 10;


    const angulo =
        Math.random() * Math.PI * 2;


    const altura =
        -2 + Math.random() * 7;


    const x =
        Math.cos(angulo) * distancia;


    const z =
        Math.sin(angulo) * distancia;


    const tamanho =
        0.015 + Math.random() * 0.045;


    const cor =
        Math.random() < 0.5
            ? "#008cff"
            : "#ff1744";


    particula.setAttribute(
        "position",
        `${x} ${altura} ${z}`
    );


    particula.setAttribute(
        "radius",
        tamanho
    );


    particula.setAttribute(
        "material",
        `
        shader: flat;
        color: ${cor};
        emissive: ${cor};
        emissiveIntensity: 4;
        `
    );


    ambiente.appendChild(particula);

}



/* ============================================================
   ELEMENTOS
============================================================ */

const barraPotencia =
    document.getElementById("barraPotencia");


const barraPreenchida =
    document.getElementById("barraPreenchida");


const controlePotencia =
    document.getElementById("controlePotencia");


const pressao =
    document.getElementById("pressao");


const temperatura =
    document.getElementById("temperatura");


const energia =
    document.getElementById("energia");


const status =
    document.getElementById("status");


const instrucao =
    document.getElementById("instrucao");


const vapor =
    document.getElementById("vapor");


const luzLampada =
    document.getElementById("luzLampada");


const areaConclusao =
    document.getElementById("areaConclusao");


const btnConcluir =
    document.getElementById("btnConcluir");


const engrenagem1 =
    document.getElementById("engrenagem1");


const engrenagem2 =
    document.getElementById("engrenagem2");


const fogo1 =
    document.getElementById("fogo1");


const fogo2 =
    document.getElementById("fogo2");


const fogo3 =
    document.getElementById("fogo3");


const controleEsquerdo =
    document.getElementById("controleEsquerdo");


const controleDireito =
    document.getElementById("controleDireito");



/* ============================================================
   VARIÁVEIS
============================================================ */

let progresso = 0;

let arrastando = false;

let concluido = false;

let controleAtivo = null;



/* ============================================================
   LIMITES DA BARRA
============================================================ */

const MIN_X = -2.15;

const MAX_X = 2.15;



/* ============================================================
   ATUALIZAR PROGRESSO
============================================================ */

function atualizarProgresso(valor) {

    if (concluido) {
        return;
    }


    progresso =
        Math.max(
            0,
            Math.min(
                100,
                valor
            )
        );


    /*
     * Margem de tolerância: a esfera de arraste cobre parte do
     * fim da barra, então é quase impossível clicar exatamente
     * no pixel de 100%. A partir de 97%, já conta como cheio.
     */

    if (progresso >= 97) {

        progresso = 100;

    }


    /* ========================================================
       POSIÇÃO DO CONTROLE
    ======================================================== */

    const x =
        MIN_X +
        ((MAX_X - MIN_X) * progresso / 100);


    controlePotencia.setAttribute(
        "position",
        `${x} 0.25 -3.80`
    );


    /* ========================================================
       BARRA VERMELHA
    ======================================================== */

    const largura =
        4.3 * progresso / 100;


    barraPreenchida.setAttribute(
        "width",
        largura
    );


    barraPreenchida.setAttribute(
        "position",
        `${MIN_X + largura / 2} 0.25 -3.84`
    );


    /* ========================================================
       PRESSÃO
    ======================================================== */

    pressao.setAttribute(
        "value",
        `${Math.round(progresso)}%`
    );


    /* ========================================================
       TEMPERATURA
    ======================================================== */

    const temperaturaAtual =
        20 + (progresso * 1);


    temperatura.setAttribute(
        "value",
        `${Math.round(temperaturaAtual)} °C`
    );


    /* ========================================================
       ENERGIA
    ======================================================== */

    energia.setAttribute(
        "value",
        `${Math.round(progresso)}%`
    );


    /* ========================================================
       FOGO
    ======================================================== */

    const escalaFogo =
        0.5 + (progresso / 100) * 1.5;


    fogo1.setAttribute(
        "scale",
        `${escalaFogo} ${escalaFogo} ${escalaFogo}`
    );


    fogo2.setAttribute(
        "scale",
        `${escalaFogo} ${escalaFogo} ${escalaFogo}`
    );


    fogo3.setAttribute(
        "scale",
        `${escalaFogo} ${escalaFogo} ${escalaFogo}`
    );


    /* ========================================================
       VAPOR
    ======================================================== */

    if (progresso >= 25) {

        vapor.setAttribute(
            "visible",
            "true"
        );

    }

    else {

        vapor.setAttribute(
            "visible",
            "false"
        );

    }


    /* ========================================================
       ENGRENAGENS
    ======================================================== */

    const rotacao =
        progresso * 10;


    engrenagem1.setAttribute(
        "rotation",
        `90 0 ${rotacao}`
    );


    engrenagem2.setAttribute(
        "rotation",
        `90 0 ${-rotacao * 1.4}`
    );


    /* ========================================================
       STATUS
    ======================================================== */

    if (progresso === 0) {

        status.setAttribute(
            "value",
            "MÁQUINA DESLIGADA"
        );

        status.setAttribute(
            "color",
            "#777777"
        );

        instrucao.setAttribute(
            "value",
            "Segure o gatilho e arraste a potência para a direita."
        );

    }


    else if (progresso < 30) {

        status.setAttribute(
            "value",
            "AQUECENDO A MÁQUINA"
        );

        status.setAttribute(
            "color",
            "#ff1744"
        );

        instrucao.setAttribute(
            "value",
            "Continue aumentando a potência."
        );

    }


    else if (progresso < 70) {

        status.setAttribute(
            "value",
            "PRESSÃO AUMENTANDO"
        );

        status.setAttribute(
            "color",
            "#008cff"
        );

        instrucao.setAttribute(
            "value",
            "A máquina está produzindo vapor."
        );

    }


    else if (progresso < 100) {

        status.setAttribute(
            "value",
            "ALTA PRESSÃO"
        );

        status.setAttribute(
            "color",
            "#ff1744"
        );

        instrucao.setAttribute(
            "value",
            "Continue até atingir 100%."
        );

    }


    /* ========================================================
       FINAL
    ======================================================== */

    if (progresso >= 100) {

        finalizarExperimento();

    }

}



/* ============================================================
   PEGAR PONTO DO LASER
============================================================ */

function obterIntersecao(controller) {

    const raycaster =
        controller.components.raycaster;


    if (!raycaster) {
        return null;
    }


    const intersecoes =
        raycaster.intersections;


    if (!intersecoes ||
        intersecoes.length === 0) {

        return null;

    }


    for (const intersecao of intersecoes) {

        if (
            intersecao.object &&
            (
                intersecao.object.el === barraPotencia ||
                intersecao.object.el === controlePotencia
            )
        ) {

            return intersecao.point;

        }

    }


    return null;

}



/* ============================================================
   COMEÇAR ARRASTAMENTO
============================================================ */

function iniciarArrastamento(controller) {

    if (concluido) {
        return;
    }


    const ponto =
        obterIntersecao(controller);


    if (!ponto) {
        return;
    }


    arrastando = true;

    controleAtivo = controller;


    status.setAttribute(
        "value",
        "CONTROLE DE POTÊNCIA ATIVADO"
    );


    status.setAttribute(
        "color",
        "#008cff"
    );

}



/* ============================================================
   ARRASTAR
============================================================ */

function atualizarArrastamento(controller) {

    if (!arrastando) {
        return;
    }


    if (controller !== controleAtivo) {
        return;
    }


    const ponto =
        obterIntersecao(controller);


    if (!ponto) {
        return;
    }


    const x =
        Math.max(
            MIN_X,
            Math.min(
                MAX_X,
                ponto.x
            )
        );


    const percentual =
        ((x - MIN_X) /
        (MAX_X - MIN_X)) * 100;


    atualizarProgresso(
        percentual
    );

}



/* ============================================================
   TERMINAR ARRASTAMENTO
============================================================ */

function terminarArrastamento(controller) {

    if (controller !== controleAtivo) {
        return;
    }


    arrastando = false;

    controleAtivo = null;


    if (!concluido) {

        if (progresso >= 100) {

            status.setAttribute(
                "value",
                "ENERGIA GERADA!"
            );

        }

        else {

            status.setAttribute(
                "value",
                `${Math.round(progresso)}% DE POTÊNCIA`
            );

        }

    }

}



/* ============================================================
   CONTROLES DO QUEST
============================================================ */

controleEsquerdo.addEventListener(
    "triggerdown",
    function () {

        iniciarArrastamento(
            controleEsquerdo
        );

    }
);


controleDireito.addEventListener(
    "triggerdown",
    function () {

        iniciarArrastamento(
            controleDireito
        );

    }
);


controleEsquerdo.addEventListener(
    "triggerup",
    function () {

        terminarArrastamento(
            controleEsquerdo
        );

    }
);


controleDireito.addEventListener(
    "triggerup",
    function () {

        terminarArrastamento(
            controleDireito
        );

    }
);



/* ============================================================
   ATUALIZAÇÃO CONTÍNUA DO LASER
============================================================ */

controleEsquerdo.addEventListener(
    "raycaster-intersection",
    function () {

        atualizarArrastamento(
            controleEsquerdo
        );

    }
);


controleDireito.addEventListener(
    "raycaster-intersection",
    function () {

        atualizarArrastamento(
            controleDireito
        );

    }
);



/* ============================================================
   TESTE PELO OLHAR / CURSOR
============================================================ */

barraPotencia.addEventListener(
    "click",
    function (evento) {

        if (concluido) {
            return;
        }


        if (
            evento.detail &&
            evento.detail.intersection
        ) {

            const ponto =
                evento.detail.intersection.point;


            const x =
                Math.max(
                    MIN_X,
                    Math.min(
                        MAX_X,
                        ponto.x
                    )
                );


            const percentual =
                ((x - MIN_X) /
                (MAX_X - MIN_X)) * 100;


            atualizarProgresso(
                percentual
            );

        }

    }
);



/*
 * A esfera de arraste fica na frente da barra (mais perto da
 * câmera) e, perto do final, cobre o pedacinho que representa
 * 100%. Sem isso, um clique ali acertava a esfera (sem ação)
 * em vez da barra, e o progresso nunca chegava aos 100%.
 */

controlePotencia.addEventListener(
    "click",
    function (evento) {

        if (concluido) {
            return;
        }


        if (
            evento.detail &&
            evento.detail.intersection
        ) {

            const ponto =
                evento.detail.intersection.point;


            const x =
                Math.max(
                    MIN_X,
                    Math.min(
                        MAX_X,
                        ponto.x
                    )
                );


            const percentual =
                ((x - MIN_X) /
                (MAX_X - MIN_X)) * 100;


            atualizarProgresso(
                percentual
            );

        }

    }
);



/* ============================================================
   FINALIZAR EXPERIMENTO
============================================================ */

function finalizarExperimento() {

    if (concluido) {
        return;
    }


    concluido = true;


    /* ========================================================
       VALORES FINAIS
    ======================================================== */

    progresso = 100;


    pressao.setAttribute(
        "value",
        "100%"
    );


    temperatura.setAttribute(
        "value",
        "120 °C"
    );


    energia.setAttribute(
        "value",
        "100%"
    );


    /* ========================================================
       CONTROLE NO FINAL
    ======================================================== */

    controlePotencia.setAttribute(
        "position",
        `${MAX_X} 0.25 -3.80`
    );


    barraPreenchida.setAttribute(
        "width",
        "4.3"
    );


    barraPreenchida.setAttribute(
        "position",
        "0 0.25 -3.84"
    );


    /* ========================================================
       VAPOR
    ======================================================== */

    vapor.setAttribute(
        "visible",
        "true"
    );


    /* ========================================================
       FOGO MÁXIMO
    ======================================================== */

    fogo1.setAttribute(
        "scale",
        "2 2 2"
    );


    fogo2.setAttribute(
        "scale",
        "2 2 2"
    );


    fogo3.setAttribute(
        "scale",
        "2 2 2"
    );


    /* ========================================================
       LÂMPADA
    ======================================================== */

    luzLampada.setAttribute(
        "color",
        "#ff1744"
    );


    luzLampada.setAttribute(
        "material",
        `
        shader: flat;
        color: #ff1744;
        emissive: #ff1744;
        emissiveIntensity: 8;
        `
    );


    /* ========================================================
       STATUS
    ======================================================== */

    status.setAttribute(
        "value",
        "ENERGIA GERADA!"
    );


    status.setAttribute(
        "color",
        "#008cff"
    );


    instrucao.setAttribute(
        "value",
        "Experimento concluído! A energia foi transformada."
    );


    /* ========================================================
       BOTÃO
    ======================================================== */

    areaConclusao.setAttribute(
        "visible",
        "true"
    );


    /* ========================================================
       SALVAR
    ======================================================== */

    localStorage.setItem(
        "maquinaConcluido",
        "true"
    );

}
